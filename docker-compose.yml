# Local development: Postgres only.
# The API and web app run on the host via `npm run api:dev` / `npm run web:dev`
# so you keep fast hot-reload. Production compose lives in docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    container_name: pitstop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: pitstop
      POSTGRES_DB: pitstop
    ports:
      - "5433:5432"
    volumes:
      - pitstop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitstop -d pitstop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pitstop_pgdata:
